<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');

        :root {
            --bg: #05040a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a103c 0%, #05040a 70%);
            --panel-bg: rgba(20, 15, 35, 0.7);
            --panel-border: rgba(155, 81, 224, 0.3);
            --accent: #9b51e0;
            --accent-glow: rgba(155, 81, 224, 0.6);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --win: #2ecc71;
            --lose: #e74c3c;
            --text: #ffffff;
            --text-dim: #8b8b9f;
            --slot-bg: #0d0a17;
            --reel-size: 90px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #e056fd);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .username { font-size: 14px; font-weight: 600; color: var(--text-dim); }
        .balance-box {
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--gold-glow);
            display: flex; align-items: center; gap: 8px;
        }
        .balance-amount { font-size: 20px; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }

        /* --- MAIN MENU --- */
        .menu-grid { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }
        .game-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .game-card::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .game-card:active::before { left: 100%; }
        .game-card:active { transform: scale(0.97); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .game-icon { font-size: 40px; margin-right: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .game-details { flex: 1; }
        .game-title { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .game-desc { font-size: 12px; color: var(--text-dim); font-weight: 600; }
        .play-btn {
            background: linear-gradient(135deg, var(--accent), #e056fd);
            color: white; border: none; padding: 12px 25px; border-radius: 12px;
            font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px var(--accent-glow);
            cursor: pointer;
        }

        /* --- OVERLAYS (MODALS) --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 4, 10, 0.95);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 30px;
            width: 100%; max-width: 350px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow);
            animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-title { font-size: 24px; font-weight: 900; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 2px; text-align: center;}
        
        /* Bet Input */
        .bet-input-wrapper {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 5px 15px; width: 100%; margin-bottom: 20px;
        }
        .bet-input-wrapper span { font-size: 20px; color: var(--gold); }
        .bet-input-wrapper input {
            flex: 1; background: transparent; border: none; color: white;
            font-size: 28px; font-weight: 800; text-align: center; outline: none;
            font-family: 'Montserrat', sans-serif;
        }
        .quick-bets { display: flex; gap: 8px; width: 100%; margin-bottom: 25px; justify-content: center; }
        .quick-bet {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim); padding: 8px 15px; border-radius: 10px;
            font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .quick-bet:active, .quick-bet.active { background: var(--accent); color: white; border-color: var(--accent); }

        .action-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4); cursor: pointer;
            margin-bottom: 15px;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
        .close-btn {
            width: 100%; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 800; cursor: pointer;
        }

        /* --- GAME OVERLAY --- */
        #game-overlay { background: rgba(5,4,10,0.98); justify-content: center; }
        
        .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 100%;}
        
        /* SLOTS */
        .slot-machine {
            background: #000; border: 4px solid var(--accent); border-radius: 24px;
            padding: 15px; box-shadow: 0 0 40px var(--accent-glow), inset 0 0 20px rgba(0,0,0,1);
            position: relative; margin-bottom: 20px;
            width: 100%; max-width: 340px;
        }
        .slot-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-dim); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        
        .reels-container {
            display: flex; justify-content: center; gap: 10px;
            background: #08060d; padding: 10px; border-radius: 16px;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 0 10px rgba(155,81,224,0.2);
        }
        
        /* Payline with neon glow */
        .payline {
            position: absolute; top: 50%; left: 5%; right: 5%; height: 2px;
            background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px #fff;
            transform: translateY(-50%); z-index: 10; opacity: 0.1; transition: 0.3s;
        }
        .payline.active { opacity: 1; box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold), 0 0 40px var(--gold); background: var(--gold); height: 4px;}

        .reel {
            width: var(--reel-size); height: 120px;
            background: linear-gradient(180deg, #110c1c 0%, #1f1838 50%, #110c1c 100%);
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .reel-strip {
            display: flex; flex-direction: column; width: 100%;
            will-change: transform;
        }
        
        .reel-item {
            width: 100%; height: 120px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 55px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* Spin animation */
        @keyframes spinReel {
            0% { transform: translateY(0); }
            100% { transform: translateY(-600px); } /* Move by 5 items */
        }
        .spinning .reel-strip {
            animation: spinReel 0.25s linear infinite;
        }
        .spinning { filter: blur(2px); transition: filter 0.1s; }

        /* Result Popup (Slots) */
        .slot-result {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); border-radius: 20px;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; backdrop-filter: blur(5px);
        }
        .slot-result-title { font-size: 32px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px;}
        .slot-result-amount { font-size: 48px; font-weight: 900; }
        .title-win { color: var(--gold); text-shadow: 0 0 20px var(--gold); }
        .title-lose { color: var(--lose); }
        .amount-win { color: var(--win); text-shadow: 0 0 20px var(--win); }
        .amount-lose { color: var(--text-dim); }

        /* WHEEL */
        .wheel-container {
            position: relative; width: 320px; height: 320px; margin-bottom: 30px;
            display: flex; justify-content: center; align-items: center;
        }
        .wheel-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-top: 30px solid var(--gold);
            filter: drop-shadow(0 0 10px var(--gold)); z-index: 10;
        }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%;
            border: 8px solid #2a1b41;
            box-shadow: 0 0 40px var(--accent-glow), inset 0 0 30px rgba(0,0,0,1);
            background: conic-gradient(
                #e74c3c 0deg 45deg, 
                #2c3e50 45deg 90deg, 
                #f1c40f 90deg 135deg, 
                #1abc9c 135deg 180deg, 
                #9b51e0 180deg 225deg,
                #2c3e50 225deg 270deg,
                #3498db 270deg 315deg,
                #2c3e50 315deg 360deg
            );
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
            position: relative;
            transform: rotate(0deg);
        }
        
        /* Wheel Center Logo */
        .wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: var(--bg); border-radius: 50%;
            border: 4px solid var(--accent); box-shadow: 0 0 20px var(--accent), inset 0 0 20px rgba(0,0,0,1);
            z-index: 5; display: flex; justify-content: center; align-items: center; font-size: 36px;
        }

        /* WHEEL RESULT */
        .wheel-result {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%; display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20; background: rgba(0,0,0,0.85); border: 4px solid var(--accent);
            backdrop-filter: blur(5px);
        }

        /* Particles container */
        #particles { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        
        /* Screenshake */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.5s; animation-iteration-count: 1; }

    </style>
</head>
<body>

    <div id="particles"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="user-info">
            <div class="avatar">👤</div>
            <div>
                <div class="username" id="ui-username">Игрок</div>
                <div style="font-size: 10px; color: var(--text-dim);">LEVEL 1</div>
            </div>
        </div>
        <div class="balance-box">
            <span style="font-size:18px;">⭐</span>
            <span class="balance-amount" id="ui-balance">1000000</span>
        </div>
    </div>

    <!-- MENU -->
    <div class="menu-grid">
        <div class="game-card" onclick="openBetMenu('wheel')">
            <div style="display:flex; align-items:center;">
                <div class="game-icon">🎡</div>
                <div class="game-details">
                    <div class="game-title">Колесо Фортуны</div>
                    <div class="game-desc">Множители до x3.0</div>
                </div>
            </div>
            <button class="play-btn">Играть</button>
        </div>

        <div class="game-card" onclick="openBetMenu('slot')">
            <div style="display:flex; align-items:center;">
                <div class="game-icon">🎰</div>
                <div class="game-details">
                    <div class="game-title">Мистический Слот</div>
                    <div class="game-desc">Джекпот 150 ⭐</div>
                </div>
            </div>
            <button class="play-btn">Играть</button>
        </div>
    </div>

    <!-- MODALS -->
    <!-- Bet Menu -->
    <div class="overlay" id="bet-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Ставка</h2>
            <div class="bet-input-wrapper">
                <span>⭐</span>
                <input type="number" id="bet-input" value="50" min="5" max="10000">
            </div>
            <div class="quick-bets">
                <button class="quick-bet" onclick="setBet(50)">50</button>
                <button class="quick-bet" onclick="setBet(100)">100</button>
                <button class="quick-bet" onclick="setBet(500)">500</button>
                <button class="quick-bet" onclick="setBet(1000)">MAX</button>
            </div>
            <button class="action-btn" onclick="startGame()">Крутить</button>
            <button class="close-btn" onclick="closeOverlay('bet-overlay')">Отмена</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="overlay" id="game-overlay">
        
        <!-- SLOTS SCREEN -->
        <div class="game-screen" id="screen-slot">
            <div class="slot-machine">
                <div class="slot-header">
                    <span>MYSTIC SLOTS</span>
                    <span style="color:var(--gold);">PAYOUT x1.5</span>
                </div>
                <div class="reels-container" id="reels-container">
                    <div class="payline" id="payline"></div>
                    <div class="reel" id="reel-1"><div class="reel-strip"></div></div>
                    <div class="reel" id="reel-2"><div class="reel-strip"></div></div>
                    <div class="reel" id="reel-3"><div class="reel-strip"></div></div>
                </div>
                
                <div class="slot-result" id="slot-result">
                    <div class="slot-result-title" id="slot-title">УВЫ</div>
                    <div class="slot-result-amount" id="slot-amount">-50 ⭐</div>
                </div>
            </div>
        </div>

        <!-- WHEEL SCREEN -->
        <div class="game-screen" id="screen-wheel">
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="wheel-element"></div>
                <div class="wheel-center">🔮</div>
                <div class="wheel-result" id="wheel-result">
                    <div class="slot-result-title" id="wheel-title">ВЫИГРЫШ</div>
                    <div class="slot-result-amount" id="wheel-amount">+100 ⭐</div>
                </div>
            </div>
        </div>

        <button class="close-btn" id="game-close-btn" style="margin-top: 30px; display: none;" onclick="closeOverlay('game-overlay')">Забрать и выйти</button>
    </div>


    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        // --- STATE ---
        let userBalance = 1000000; 
        let currentGame = '';
        let currentBet = 50;
        
        document.getElementById('ui-balance').innerText = userBalance.toLocaleString('ru-RU');

        const updateUI = () => {
            document.getElementById('ui-balance').innerText = userBalance.toLocaleString('ru-RU');
        };

        function setBet(amount) {
            if(amount === 1000) {
                document.getElementById('bet-input').value = userBalance > 10000 ? 10000 : userBalance;
            } else {
                document.getElementById('bet-input').value = amount;
            }
        }

        function openBetMenu(game) {
            currentGame = game;
            document.getElementById('bet-overlay').style.display = 'flex';
        }

        function closeOverlay(id) {
            document.getElementById(id).style.display = 'none';
            // Сброс экранов
            document.getElementById('screen-slot').style.display = 'none';
            document.getElementById('screen-wheel').style.display = 'none';
            document.getElementById('game-close-btn').style.display = 'none';
        }

        function startGame() {
            const bet = parseInt(document.getElementById('bet-input').value);
            if (isNaN(bet) || bet < 5) return tg.showAlert("Минимальная ставка 5 ⭐");
            if (bet > userBalance) return tg.showAlert("Недостаточно средств!");
            if (bet > 10000) return tg.showAlert("Максимальная ставка 10000 ⭐");

            currentBet = bet;
            userBalance -= currentBet;
            updateUI();
            
            document.getElementById('bet-overlay').style.display = 'none';
            document.getElementById('game-overlay').style.display = 'flex';

            if (currentGame === 'slot') {
                document.getElementById('screen-slot').style.display = 'flex';
                playSlots();
            } else {
                document.getElementById('screen-wheel').style.display = 'flex';
                playWheel();
            }
        }

        // ==========================================
        // SLOTS LOGIC
        // ==========================================
        const EMOJIS = ['🍒', '🍋', '🍉', '🔔', '💎', '💀'];
        const WIN_EMOJIS = ['🍒', '🍋', '🍉', '🔔'];
        
        // Fill reels with random stuff for visual
        function populateReels() {
            for(let i=1; i<=3; i++) {
                const strip = document.querySelector(`#reel-${i} .reel-strip`);
                strip.innerHTML = '';
                for(let j=0; j<10; j++) {
                    strip.innerHTML += `<div class="reel-item">${EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}</div>`;
                }
            }
        }

        function playSlots() {
            document.getElementById('slot-result').style.display = 'none';
            document.getElementById('payline').classList.remove('active');
            document.getElementById('game-close-btn').style.display = 'none';

            populateReels();
            const reels = [1, 2, 3].map(i => document.getElementById(`reel-${i}`));
            reels.forEach(r => r.classList.add('spinning'));

            // --- MATH LOGIC ---
            const chance = Math.random();
            let win = 0;
            let combo = [];

            if (chance < 0.01) {
                // 1% JACKPOT (3 Diamonds)
                win = currentBet * 2.0; // Возврат ставки + 100% сверху (чистый x2)
                combo = ['💎', '💎', '💎'];
            } else if (chance < 0.15) {
                // 14% THREE OF A KIND
                const sym = WIN_EMOJIS[Math.floor(Math.random()*WIN_EMOJIS.length)];
                combo = [sym, sym, sym];
                win = currentBet * 0.5; // Возврат x0.5 (плюс сама ставка уже списана)
            } else if (chance < 0.35) {
                // 20% TWO OF A KIND
                const sym = WIN_EMOJIS[Math.floor(Math.random()*WIN_EMOJIS.length)];
                let other = WIN_EMOJIS[Math.floor(Math.random()*WIN_EMOJIS.length)];
                while(other === sym) other = WIN_EMOJIS[Math.floor(Math.random()*WIN_EMOJIS.length)];
                combo = [sym, sym, other];
                combo.sort(() => Math.random() - 0.5); // Randomize order
                win = currentBet * 0.2; // Возврат x0.2
            } else {
                // 65% LOSS
                win = 0;
                combo = ['💀', '💀', '💀'];
            }

            // --- ANIMATION SEQUENCE ---
            setTimeout(() => {
                // Stop 1
                stopReel(1, combo[0]);
                setTimeout(() => {
                    // Stop 2
                    stopReel(2, combo[1]);
                    setTimeout(() => {
                        // Stop 3
                        stopReel(3, combo[2]);
                        
                        // Final Result
                        setTimeout(() => {
                            showSlotResult(combo, win);
                        }, 400);

                    }, 500);
                }, 500);
            }, 1500); // Spin for 1.5s total
        }

        function stopReel(reelNum, finalEmoji) {
            const reel = document.getElementById(`reel-${reelNum}`);
            const strip = reel.querySelector('.reel-strip');
            reel.classList.remove('spinning');
            
            // Set final emoji instantly
            strip.innerHTML = `<div class="reel-item">${finalEmoji}</div>`;
        }

        function showSlotResult(combo, win) {
            const resultScreen = document.getElementById('slot-result');
            const title = document.getElementById('slot-title');
            const amount = document.getElementById('slot-amount');
            const payline = document.getElementById('payline');

            resultScreen.style.display = 'flex';
            
            if (combo[0] === combo[1] && combo[1] === combo[2]) {
                if(combo[0] !== '💀') {
                    payline.classList.add('active');
                    if(win > currentBet) triggerParticles(100); // Confetti for jackpot
                }
            } else if (combo[0] === combo[1] || combo[1] === combo[2] || combo[0] === combo[2]) {
                if(combo[0] !== '💀') payline.classList.add('active');
            }

            if (win > 0) {
                title.innerText = win >= currentBet * 2 ? "ДЖЕКПОТ!" : "ВЫИГРЫШ";
                title.className = "slot-result-title title-win";
                amount.innerText = `+${win.toLocaleString('ru-RU')} ⭐`;
                amount.className = "slot-result-amount amount-win";
                userBalance += win;
            } else {
                title.innerText = "УВЫ";
                title.className = "slot-result-title title-lose";
                amount.innerText = `-${currentBet.toLocaleString('ru-RU')} ⭐`;
                amount.className = "slot-result-amount amount-lose";
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 500);
            }
            updateUI();
            document.getElementById('game-close-btn').style.display = 'block';
        }

        // ==========================================
        // WHEEL LOGIC
        // ==========================================
        function playWheel() {
            const wheel = document.getElementById('wheel-element');
            const resultScreen = document.getElementById('wheel-result');
            resultScreen.style.display = 'none';
            
            // Reset wheel without transition
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(0deg)`;
            
            // Force reflow
            void wheel.offsetWidth;

            // Restore transition
            wheel.style.transition = 'transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)';

            const chance = Math.random();
            let win = 0;
            let targetAngle = 0; // Angle where pointer will land

            if (chance < 0.02) { win = currentBet * 3.0; targetAngle = 202.5; } // x3 (Purple)
            else if (chance < 0.08) { win = currentBet * 2.0; targetAngle = 157.5; } // x2 (Blue)
            else if (chance < 0.20) { win = currentBet * 0.5; targetAngle = 337.5; } // x0.5 (Dark)
            else { win = 0; targetAngle = 247.5; } // Loss (Orange)

            // Calculate rotation: 5 full spins + target angle
            // Math.random() * 40 - 20 adds a small offset so it doesn't land exactly in the center
            const randomDeg = 1800 + targetAngle + (Math.random() * 40 - 20);
            
            // Start spin
            setTimeout(() => {
                wheel.style.transform = `rotate(${randomDeg}deg)`;
            }, 50);

            // Wait for spin to finish (6s transition + buffer)
            setTimeout(() => {
                showWheelResult(win);
            }, 6100);
        }

        function showWheelResult(win) {
            const resultScreen = document.getElementById('wheel-result');
            const title = document.getElementById('wheel-title');
            const amount = document.getElementById('wheel-amount');

            resultScreen.style.display = 'flex';

            if (win > 0) {
                title.innerText = "ВЫИГРЫШ";
                title.className = "slot-result-title title-win";
                amount.innerText = `+${win.toLocaleString('ru-RU')} ⭐`;
                amount.className = "slot-result-amount amount-win";
                userBalance += win;
                if(win >= currentBet * 2) triggerParticles(50);
            } else {
                title.innerText = "ПРОИГРЫШ";
                title.className = "slot-result-title title-lose";
                amount.innerText = `-${currentBet.toLocaleString('ru-RU')} ⭐`;
                amount.className = "slot-result-amount amount-lose";
            }
            updateUI();
            document.getElementById('game-close-btn').style.display = 'block';
        }
