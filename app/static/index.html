
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10051f">
<title>Зал Оракула</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
--bg: #10051f; --panel: rgba(35, 12, 62, 0.88); --purple: #922cff;
--text: #f5eaff; --muted: #b89bd7; --gold: #ffd34f; --border: rgba(164, 65, 255, 0.48);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
body { min-height: 100vh; min-height: 100dvh; }
.app { position: relative; width: 100%; max-width: 520px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 16px 16px 100px; overflow: hidden; background: radial-gradient(ellipse at 50% 28%, rgba(104, 25, 174, 0.18), transparent 42%), linear-gradient(180deg, #10051f 0%, #0c0418 100%); }

.screen { display: none; animation: screenAppear 0.35s ease both; }
.screen.active { display: block; }
@keyframes screenAppear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.topbar { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-bottom: 34px; }
.user-button { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border: 1px solid var(--border); border-radius: 50px; background: linear-gradient(120deg, rgba(62, 20, 105, 0.8), rgba(20, 7, 39, 0.9)); }
.avatar { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 2px solid #9e42ff; border-radius: 50%; background: radial-gradient(circle, #8d39d9, #291044 75%); box-shadow: 0 0 15px rgba(151, 53, 255, 0.55); font-size: 24px; }
.user-info strong { font-size: 15px; display: block; }
.user-info small { color: var(--muted); font-size: 11px; }
.balance { display: flex; align-items: center; gap: 6px; padding: 10px 15px; border: 1px solid rgba(255, 186, 76, 0.3); border-radius: 50px; background: linear-gradient(120deg, #26113c, #160824); }
.star-icon { color: var(--gold); font-size: 20px; }
.balance strong { font-size: 18px; }

.home-title { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 15px 0 24px; }
.home-title h1, .section-heading h1 { color: #d8a0ff; font-family: Georgia, serif; font-size: 32px; font-weight: 400; text-align: center; text-shadow: 0 0 14px rgba(180, 91, 255, 0.8); }
.title-decoration { width: 35px; height: 1px; background: linear-gradient(90deg, transparent, #b65cff); }
.title-decoration:last-child { transform: rotate(180deg); }
.section-heading { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 18px 0 28px; }
.section-heading span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #a746ff); }
.section-heading span:last-child { transform: rotate(180deg); }

.oracle-section { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 330px; margin: 0 auto 20px; isolation: isolate; }
.oracle-glow { position: absolute; top: 30%; left: 50%; width: 250px; height: 250px; border-radius: 50%; background: #8124ff; opacity: 0.16; filter: blur(70px); transform: translate(-50%, -50%); z-index: -1; }
.crystal-orb { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; width: 205px; height: 205px; overflow: hidden; border: 2px solid rgba(207, 155, 255, 0.9); border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(229, 185, 255, 0.7), transparent 17%), radial-gradient(circle at 50% 55%, #48117d 0%, #21073f 50%, #12051f 100%); box-shadow: inset -15px -20px 35px rgba(0, 0, 0, 0.65), inset 10px 8px 25px rgba(219, 164, 255, 0.3), 0 0 15px #9e35ff, 0 0 40px rgba(155, 48, 255, 0.65); }
.orb-magic { position: relative; width: 145px; height: 145px; border: 1px solid rgba(179, 86, 255, 0.3); border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(174, 65, 255, 0.6), transparent, rgba(217, 145, 255, 0.4), transparent); animation: orbRotate 8s linear infinite; }
@keyframes orbRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.orb-stand { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; margin-top: -12px; }
.stand-top { width: 190px; height: 17px; border: 1px solid #9f53e6; border-radius: 50%; background: linear-gradient(90deg, #31104c, #9b45dc, #31104c); box-shadow: 0 0 13px #9e3cff; }
.stand-body { display: flex; align-items: center; justify-content: center; width: 145px; height: 48px; margin-top: -4px; border: 1px solid #6b2da0; border-radius: 5px 5px 25px 25px; background: linear-gradient(90deg, #170823, #4a176d, #170823); box-shadow: inset 0 0 15px #10051c; }
.stand-gem { color: #d9a0ff; font-size: 30px; text-shadow: 0 0 12px #b34cff; }
.stand-bottom { width: 180px; height: 13px; margin-top: -2px; border: 1px solid #7734a7; border-radius: 50%; background: #28103f; box-shadow: 0 5px 20px rgba(162, 54, 255, 0.4); }

.welcome-card { padding: 23px 15px; border: 1px solid var(--border); border-radius: 25px; background: radial-gradient(circle at 50% 0%, rgba(117, 40, 185, 0.25), transparent 60%), linear-gradient(140deg, rgba(43, 13, 72, 0.9), rgba(19, 6, 35, 0.95)); text-align: center; box-shadow: 0 0 22px rgba(122, 33, 207, 0.12); }
.welcome-card h2 { color: #d8a0ff; font-family: Georgia, serif; font-size: 23px; font-weight: 400; }
.welcome-balance { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 3px; }
.welcome-balance span { color: var(--gold); font-size: 32px; }
.welcome-balance strong { color: #e4c5ff; font-size: 40px; font-weight: 500; text-shadow: 0 0 15px rgba(179, 97, 255, 0.5); }
.welcome-card p { color: var(--muted); font-size: 14px; }

.bottom-nav { position: fixed; z-index: 20; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; display: grid; grid-template-columns: repeat(3, 1fr); width: min(calc(100% - 20px), 500px); padding: 12px 5px 10px; border: 1px solid rgba(136, 47, 206, 0.5); border-radius: 30px; background: rgba(20, 6, 36, 0.96); box-shadow: 0 -5px 30px rgba(102, 29, 170, 0.17); backdrop-filter: blur(15px); transform: translateX(-50%); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #a981d0; font-size: 11px; cursor: pointer; transition: 0.2s; }
.nav-item.active { color: #e0b9ff; text-shadow: 0 0 10px #a64bff; }
.nav-icon { font-size: 22px; filter: drop-shadow(0 0 5px rgba(167, 90, 255, 0.3)); }
</style>

</head>
<body>

<div class="app">
<!-- ШАПКА -->
<header class="topbar">
<div class="user-button">
<span class="avatar">🐰</span>
<span class="user-info">
<strong>Гость</strong>
<small>Добро пожаловать!</small>
</span>
</div>
<div class="balance">
<span class="star-icon">★</span>
<strong id="balance-val">100</strong>
</div>
</header>

<!-- ГЛАВНЫЙ ЭКРАН (Шар) -->
<main class="screen active" id="screen-home">
<div class="home-title">
<span class="title-decoration"></span>
<h1>Зал Оракула</h1>
<span class="title-decoration"></span>
</div>

<div class="oracle-section">
<div class="oracle-glow"></div>
<div class="crystal-orb">
<div class="orb-shine"></div>
<div class="orb-magic">
<span class="magic-star star-one">✦</span>
<span class="magic-star star-two">✧</span>
<span class="magic-star star-three">✦</span>
<span class="magic-core"></span>
</div>
</div>
<div class="orb-stand">
<div class="stand-top"></div>
<div class="stand-body"><span class="stand-gem">◆</span></div>
<div class="stand-bottom"></div>
</div>
</div>

<div class="welcome-card">
<h2>Добро пожаловать!</h2>
<div class="welcome-balance"><span>★</span> <strong id="welcome-bal">100</strong></div>
<p>Твой баланс</p>
</div>
</main>

<!-- ЭКРАН ИГР (Пока пустой) -->
<main class="screen" id="screen-games">
<div class="section-heading">
<span></span>
<h1>Игры</h1>
<span></span>
</div>
<div id="game-container" style="width: 100%; height: 100%;">
<!-- Сюда потом загрузится игра -->
<p style="text-align:center; color:#b89bd7; margin-top:50px;">Игры скоро появятся...</p>
</div>
</main>

<!-- ЭКРАН КЕЙСОВ (Пока пустой) -->
<main class="screen" id="screen-cases">
<div class="section-heading">
<span></span>
<h1>Кейсы</h1>
<span></span>
</div>
<div id="cases-container" style="width: 100%; height: 100%;">
<!-- Сюда потом загрузятся кейсы -->
<p style="text-align:center; color:#b89bd7; margin-top:50px;">Кейсы скоро появятся...</p>
</div>
</main>

<!-- НИЖНЕЕ МЕНЮ -->
<nav class="bottom-nav">
<button class="nav-item active" onclick="switchScreen('home', this)">
<span class="nav-icon">🏠</span>
<span>Главная</span>
</button>
<button class="nav-item" onclick="switchScreen('games', this)">
<span class="nav-icon">🎮</span>
<span>Игры</span>
</button>
<button class="nav-item" onclick="switchScreen('cases', this)">
<span class="nav-icon">🎁</span>
<span>Кейсы</span>
</button>
</nav>
</div>

<!-- ПОДКЛЮЧАЕМ ЛОГИКУ -->

<script>
// Подключаем Telegram
const tg = window.Telegram.WebApp;
tg.expand();

// Функция переключения экранов
function switchScreen(screenId, btn) {
// Скрываем все экраны
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
// Убираем активный класс со всех кнопок
document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

// Показываем нужный
const target = document.getElementById('screen-' + screenId);
if (target) target.classList.add('active');

// Подсвечиваем кнопку
if (btn) btn.classList.add('active');
}

// Устанавливаем баланс при загрузке
document.addEventListener('DOMContentLoaded', () => {
document.getElementById('balance-val').innerText = '100';
document.getElementById('welcome-bal').innerText = '100';
});
</script>

</body>
</html>
