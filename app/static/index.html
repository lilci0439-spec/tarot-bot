<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0812">
    <title>Magic Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

        /* =========================================
           ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ
           ========================================= */
        :root {
            --bg-dark: #0a0812;
            --bg-gradient: radial-gradient(circle at 50% -20%, #2d1860 0%, #0a0812 70%);
            --panel: #15111f;
            --panel-light: #1f1830;
            --panel-hover: #271e3d;
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --primary-dark: #6d28d9;
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.4);
            --green: #10b981;
            --red: #ef4444;
            --text: #f5f2ff;
            --text-dim: #9b93b9;
            --border: rgba(139, 92, 246, 0.15);
            --border-light: rgba(255, 255, 255, 0.05);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.3);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --font-main: 'Montserrat', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--font-main);
            color: var(--text);
            line-height: 1.4;
        }

        body {
            background: var(--bg-gradient) fixed;
            padding-top: env(safe-area-inset-top);
            display: flex;
            flex-direction: column;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
            outline: none;
        }

        /* Скроллбар для Webkit */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 4px; }

        /* =========================================
           ЗАГРУЗОЧНЫЙ ЭКРАН (SPLASH)
           ========================================= */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .splash-ball-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .splash-ball {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #555 0%, #1a1a1a 40%, #000 100%);
            box-shadow: 
                inset -15px -15px 30px rgba(0,0,0,0.9), 
                inset 10px 10px 20px rgba(255,255,255,0.2), 
                0 20px 40px rgba(0,0,0,0.8),
                0 0 60px rgba(139, 92, 246, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: ballHover 2s infinite ease-in-out;
            position: relative;
        }

        .splash-ball-center {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 900;
            color: #000;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .splash-ball-reflection {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 40px;
            height: 25px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            transform: rotate(-45deg);
            filter: blur(3px);
        }

        @keyframes ballHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .splash-ball.roll-away {
            animation: rollRight 1s cubic-bezier(0.5, 0, 1, 1) forwards !important;
        }

        @keyframes rollRight {
            0% { transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateX(120vw) rotate(1080deg); opacity: 0; }
        }

        .splash-text {
            margin-top: 40px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* =========================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ========================================= */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #app.loaded { opacity: 1; }

        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            padding-bottom: 100px; /* Место под меню */
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.3s ease;
        }

        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           ВЕРХНЯЯ ПАНЕЛЬ (HEADER)
           ========================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 20px;
            background: rgba(21, 17, 31, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #c4b5fd, #8b5cf6, #6d28d9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulse 2s infinite;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 900;
            color: var(--gold);
            border: 1px solid rgba(251, 191, 36, 0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .balance-pill:active { transform: scale(0.95); }
        .balance-pill .star { font-size: 16px; }

        /* =========================================
           СЕТКА ИГР (GAMES GRID)
           ========================================= */
        .section-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .game-tile {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-tile:active {
            transform: scale(0.96);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .game-tile-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            opacity: 0.8;
        }

        .game-tile.wheel .game-tile-bg { background: linear-gradient(180deg, rgba(139, 92, 246, 0.2) 0%, transparent 100%); }
        .game-tile.slots .game-tile-bg { background: linear-gradient(180deg, rgba(239, 68, 68, 0.2) 0%, transparent 100%); }
        .game-tile.mines .game-tile-bg { background: linear-gradient(180deg, rgba(16, 185, 129, 0.2) 0%, transparent 100%); }

        .game-tile-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .game-tile-icon {
            font-size: 50px;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            align-self: center;
            margin-top: auto;
        }

        .game-tile-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text);
        }

        .game-tile-desc {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
        }

        .game-tile-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* =========================================
           КЕЙСЫ
           ========================================= */
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .case-card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .case-card:active { transform: scale(0.97); }

        .case-card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 10% 50%, rgba(139, 92, 246, 0.3) 0%, transparent 60%);
            z-index: 1;
        }

        .case-card-icon {
            position: relative;
            z-index: 2;
            font-size: 70px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }

        .case-card-info {
            position: relative;
            z-index: 2;
            flex: 1;
        }

        .case-card-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .case-card-price {
            display: inline-block;
            background: var(--primary-dark);
            color: #fff;
            padding: 6px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        /* =========================================
           ПРОФИЛЬ
           ========================================= */
        .profile-card {
            background: var(--panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-panel);
        }

        .profile-card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; height: 100px;
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.3) 0%, transparent 100%);
            z-index: 1;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--panel-light);
            border: 3px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin-bottom: 15px;
            z-index: 2;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 900;
            z-index: 2;
        }

        .profile-id {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 20px;
            z-index: 2;
        }

        .profile-balance {
            font-size: 42px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
            text-shadow: 0 0 30px var(--gold-glow);
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            z-index: 2;
        }

        /* =========================================
           НИЖНЕЕ МЕНЮ (TAB BAR)
           ========================================= */
        .tab-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(21, 17, 31, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + var(--safe-bottom));
            z-index: 100;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            transition: color 0.2s;
            position: relative;
            width: 33%;
        }

        .tab-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }

        .tab-btn.active {
            color: var(--primary-light);
        }

        .tab-btn.active svg {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 30px;
            height: 3px;
            border-radius: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* =========================================
           МОДАЛЬНЫЕ ОКНА И КНОПКИ
           ========================================= */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 8, 18, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .overlay.active { display: flex; }

        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 25px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(139, 92, 246, 0.1);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 12px;
        }

        .btn:active { transform: scale(0.97); opacity: 0.9; }
        
        .btn.dim {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-light);
            box-shadow: none;
            color: var(--text-dim);
        }

        .close-btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Ввод ставки */
        .bet-input {
            width: 100%;
            padding: 20px;
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--primary);
            border-radius: var(--radius-md);
            color: white;
            outline: none;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Быстрые ставки */
        .quick-bets {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
        }

        .quick-bet {
            flex: 1;
            background: var(--panel-light);
            border: 1px solid var(--border-light);
            color: var(--text-dim);
            padding: 10px 0;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .quick-bet:active { background: var(--primary-dark); color: white; }

    </style>
</head>
