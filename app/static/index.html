<!DOCTYPE html>

<head>

<title>Перебеги дорогу — Зал Оракула</title>

<style>

  --bg:#10051f;
  --panel:#1c0d2e;

  --purple:#922cff;
  --light:#c18aff;
  --text:#f8efff;
  --muted:#a993bd;
  --green:#70efad;
  --red:#ff658b;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:Arial,sans-serif; min-height:100dvh; overflow:hidden; user-select:none; }
button,input { font:inherit; }
button { border:0; cursor:pointer; }

.app {
  max-width:480px;
  height:100dvh;
  margin:auto;
  padding:15px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:11px;
  background: radial-gradient(ellipse at 50% 0%,#54207855,transparent 55%), var(--bg);
}

.header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-icon { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:linear-gradient(145deg,#6925a0,#241039); border:1px solid var(--light); font-size:24px; box-shadow:0 0 18px #922cff55; }
.brand-name { font-size:14px; font-weight:900; letter-spacing:1px; }
.brand-sub { font-size:10px; color:var(--muted); margin-top:4px; }

.balance-box strong { color:var(--light); }

.heading { display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.heading h1 { font-size:19px; }
.location-label { color:var(--light); font-size:11px; font-weight:bold; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; flex-shrink:0; }
.stat { background:var(--panel); border:1px solid #42265c; border-radius:11px; text-align:center; padding:8px 3px; }
.stat-labelcenter {; color:var(--muted padding);: font14-sizepx:10px; margin-bottom:5;px; }
.stat background-value { font-weight:bold; font:#-size:15px; }

.green { color:.var(--greenover); }

canvas { display:block; width:100%; height:al100%; touch-action:none; }

.overlay { position:absolute; inset:0; z-index:5; display {:flex; width justify-content::center; align-items:100%; max-width:310px; background:linear-gradient(145deg,#32164e,#190a29); border:1px solid #a65aff; border-radius:18px; padding:19px; text-align:center; box-shadow:0 0 35px #922cff44; max-height:95%; overflow-y:auto; }
.modal h2 { font-size:20px; margin-bottom:9px; }
.modal p { color:#c2afd5; font-size:12px; line-height:1.5; margin-bottom:14px; }
.field-label { display:block; color:#c5aedb; font-size:11px; text-align:left; margin:12px 0 6px; }
input { width:100%; background:#10051f; color:white; border:1px solid #7944a7; border-radius:10px; padding:13px; outline:none; font-size:16px; }
input:focus { border-color:#c18aff; }

.primary { width:100%; background:linear-gradient(100deg,#7521c7,#a94aff); color:white; border-radius:11px; padding:13px; font-weight:bold; box-shadow:0 0 17px #922cff55; }
.primary:active { transform:scale(.98); }
.secondary { width:100%; background:#321c49; color:#e8d5ff; border:1px solid #674087; border-radius:11px; padding:12px; margin-top:8px; }

.difficulty-title { color:var(--muted); font-size:10px; text-align:left; margin:10px 0 7px; }
.difficulties { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.difficulty { padding:9px 2px; border-radius:9px; background:#28153b; border:1px solid #4b3062; color:#c7b2dc; font-size:9px; }
.difficulty strong { display:block; font-size:13px; margin-bottom:4px; }
.difficulty.active { background:#60218f; border-color:#d0a0ff; color:white; box-shadow:0 0 12px #922cff55; }

.bottom-panel { background:linear-gradient(145deg,#211034,#170a27); border:1px solid #4c286e; border-radius:15px; padding:10px; flex-shrink:0; }
.panel-row { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:7px; align-items:end; }
.panel-label { color:var(--muted); font-size:10px; margin-bottom:6px; }
.stake-input { padding:12px 7px; text-align:center; font-size:14px; }
.play-button { height:43px; }
.auto-button { height:43px; border-radius:10px; background:#342047; color:#e8d4ff; border:1px solid #75459c; font-weight:bold; font-size:12px; }
.auto-button.active { background:#60218f; border-color:#d3a0ff; }
.status { text-align:center; font-size:10px; color:var(--muted); margin-top:9px; min-height:12px; }
button:disabled { opacity:.4; cursor:not-allowed; }

@media(max-height:650px) {
  .app { gap:7px; padding-top:8px; }
  .brand-icon { width:35px; height:35px; }
  .bottom-panel { padding:7px; }
  .stat { padding:6px; }
}

<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-icon">🐇</div>
      <div>
        <div class="brand-name">ЗАЛ ОРАКУЛА</div>
        <div class="brand-sub">ПЕРЕБЕГИ ДОРОГУ</div>
      </div>
    </div>
    <div class="balance-box">
      🔮 <strong id="balanceText">100</strong> сфер
    </div>
  </header>

  <div class="heading">
    <h1>Перебеги дорогу</h1>
    <span class="location-label" id="locationName">ГОРОД</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Локация</div>
      <div class="stat-value" id="stageText">1</div>
    </div>
    <div class="stat">
      <div class="stat-label">Множитель</div>
      <div class="stat-value purple" id="multiplierText">×1.10</div>
    </div>
    <div class="stat">
      <div class="stat-label">Текущий счёт</div>
      <div class="stat-value green" id="scoreText">0</div>
    </div>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h2 id="modalTitle">🔮 Новое испытание</h2>
        <p id="modalDescription">Выбери сложность и размер ставки. Проведи зайца через препятствия.</p>

        <div id="setupControls">
          <label class="field-label" for="stakeInput">Ставка в сферах</label>
          <input id="stakeInput" type="number" min="20" max="10000" value="20" step="1">

          <div class="difficulty-title">ВЫБЕРИ СЛОЖНОСТЬ</div>
          <div class="difficulties">
            <button class="difficulty active" data-level="easy"><strong>×1.1</strong>Лёгкая</button>
            <button class="difficulty" data-level="medium"><strong>×2</strong>Средняя</button>
            <button class="difficulty" data-level="hard"><strong>×5</strong>Тяжёлая</button>
            <button class="difficulty" data-level="impossible"><strong>×10</strong>Невозможная</button>
          </div>

          <p id="potentialWin" style="margin-top:12px;margin-bottom:10px">Возможная награда: 22 сферы</p>
          <button class="primary" id="startButton">Начать игру</button>
        </div>

        <div id="resultControls" style="display:none">
          <button class="primary" id="againButton">Новая игра</button>
          <button class="secondary" id="closeButton">Вернуться</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="panel-row">
      <div>
        <div class="panel-label">СТАВКА</div>
        <input class="stake-input" id="bottomStake" type="number" min="20" max="10000" value="20">
      </div>
      <div>
        <div class="panel-label">ИГРА</div>
        <button class="primary play-button" id="bottomPlay">ИГРАТЬ</button>
      </div>
      <div>
        <div class="panel-label">УПРАВЛЕНИЕ</div>
        <button class="auto-button" id="autoButton">АВТО</button>
      </div>
    </div>
    <div class="status" id="statusText">Выбери ставку и начинай испытание</div>
  </div>

</div>

<script>
"use strict";

let balance = 100;
const MIN_BET = 20;
const MAX_BET = 10000;

const difficulties = {
  easy: { name: "Лёгкая", multiplier: 1.1, speed: 0.8, randomness: 0.15 },
  medium: { name: "Средняя", multiplier: 2, speed: 1.15, randomness: 0.35 },
  hard: { name: "Тяжёлая", multiplier: 5, speed: 1.6, randomness: 0.6 },
  impossible: { name: "Невозможная", multiplier: 10, speed: 2.2, randomness: 0.85 }
};

let selectedDifficulty = "easy";
let currentBet = 20;
let stage = 1;
let score = 0;
let currentMultiplier = 1;
let gameRunning = false;
let gamePaused = false;
let gameFinished = false;
let autoPilot = false;
let animationId = null;
let lastTime = 0;
let spawnTimer = 0;
let stoneProgress = 0;
let player = { x: 2, y: 7 };
let obstacles = [];
let logs = [];
let stageTransition = false;
let transitionTimer = 0;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const stakeInput = document.getElementById("stakeInput");
const bottomStake = document.getElementById("bottomStake");

const LANES = 5;
const ROWS = 8;

const $ = id => document.getElementById(id);

function updateBalance() { $("balanceText").textContent = Math.floor(balance); }
function updateStats() { $("stageText").textContent = stage; $("multiplierText").textContent = "×" + currentMultiplier.toFixed(2); $("scoreText").textContent = score; }
function setStatus(message) { $("statusText").textContent = message; }
function getDifficulty() { return difficulties[selectedDifficulty]; }

function calculatePotentialReward() { return Math.floor(currentBet * getDifficulty().multiplier); }
function updatePotentialWin() { $("potentialWin").textContent = "Награда за победу: " + calculatePotentialReward() + " сфер"; }

function showSetup() {
  gameRunning = false; gamePaused = false; gameFinished = false; autoPilot = false;
  $("autoButton").classList.remove("active"); $("autoButton").textContent = "АВТО";
  $("modalTitle").textContent = "🔮 Новое испытание";
  $("modalDescription").textContent = "Выбери сложность и размер ставки. Проведи зайца через препятствия и постарайся пройти все локации.";
  $("setupControls").style.display = "block"; $("resultControls").style.display = "none";
  overlay.classList.remove("hidden");
  updatePotentialWin();
  drawGame();
}

function debitBalance(amount) { if (balance < amount) return false; balance -= amount; updateBalance(); return true; }
function creditBalance(amount) { balance += amount; updateBalance(); return true; }

function validateBet() {
  const value = Number(stakeInput.value);
  if (!Number.isInteger(value)) { setStatus("Введи целое число сфер"); return false; }
  if (value < MIN_BET) { setStatus("Минимальная ставка — 20 сфер"); return false; }
  if (value > MAX_BET) { setStatus("Максимальная ставка — 10 000 сфер"); return false; }
  if (value > balance) { setStatus("Недостаточно сфер на балансе"); return false; }
  currentBet = value; bottomStake.value = value; return true;
}

document.querySelectorAll(".difficulty").forEach(button => {
  button.addEventListener("click", () => {
    if (gameRunning) return;
    document.querySelectorAll(".difficulty").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    selectedDifficulty = button.dataset.level;
    updatePotentialWin();
  });
});

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(rect.width * ratio));
  canvas.height = Math.max(1, Math.floor(rect.height * ratio));
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  drawGame();
}

function laneWidth() { return canvas.clientWidth / LANES; }
function rowHeight() { return canvas.clientHeight / ROWS; }
function playerPosition() { return { x: (player.x + 0.5) * laneWidth(), y: (player.y + 0.5) * rowHeight() }; }

function drawRoad() {
  const w = canvas.clientWidth; const h = canvas.clientHeight; const lw = w / LANES;

  // Трава по бокам
  ctx.fillStyle = "#1b3a22";
  ctx.fillRect(0, 0, w, h);

  // Дорога по центру
  ctx.fillStyle = "#29272e";
  ctx.fillRect(lw * 0.5, 0, w - lw, h);

  // Тротуары
  ctx.fillStyle = "#77717e";
  ctx.fillRect(lw * 0.5, 0, lw * 0.5, h);
  ctx.fillRect(w - lw, 0, lw * 0.5, h);

  // Разметка
  ctx.strokeStyle = "#a79eaa";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([12, 12]);
  for (let i = 1; i < LANES - 1; i++) {
    ctx.beginPath();
    ctx.moveTo(lw * 0.5 + i * lw, 0);
    ctx.lineTo(lw * 0.5 + i * lw, h);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Бордюры
  ctx.fillStyle = "#b38ae0";
  ctx.fillRect(lw * 0.5, 0, 4, h);
  ctx.fillRect(w - lw - 4, 0, 4, h);
}

function drawCars() {
  const lw = laneWidth(); const rh = rowHeight();

  obstacles.forEach(item => {
    if (item.type !== "car") return;
    const x = (item.x + 0.5) * lw + lw * 0.5; // Сдвиг из-за тротуаров
    const y = (item.y + 0.5) * rh;

    // Тень
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath(); ctx.ellipse(x, y + 15, lw * 0.35, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Кузов
    ctx.fillStyle = item.color;
    ctx.beginPath(); ctx.roundRect(x - lw * 0.35, y - 16, lw * 0.7, 32, 8); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1.5; ctx.stroke();

    // Стекло
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.roundRect(x - lw * 0.2, y - 10, lw * 0.4, 10, 3); ctx.fill();

    // Фары
    ctx.fillStyle = "#fff";
    ctx.fillRect(x - lw * 0.3, y - 12, 4, 4);
    ctx.fillRect(x + lw * 0.26, y - 12, 4, 4);

    // Колеса
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(x - lw * 0.25, y + 16, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + lw * 0.25, y + 16, 5, 0, Math.PI * 2); ctx.fill();
  });
}

function drawStone() {
  const w = canvas.clientWidth; const h = canvas.clientHeight;
  const x = w / 2; const y = h - 17 - stoneProgress * h * 0.11; const radius = Math.min(w * 0.13, 34);

  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath(); ctx.ellipse(x, y + radius - 5, radius * 0.8, 10, 0, 0, Math.PI * 2); ctx.fill();

  const gradient = ctx.createRadialGradient(x - radius * 0.4, y - radius * 0.4, radius * 0.1, x, y, radius);
  gradient.addColorStop(0, "#999"); gradient.addColorStop(0.5, "#555"); gradient.addColorStop(1, "#111");

  ctx.fillStyle = gradient;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = "#922cff"; ctx.lineWidth = 2;
  ctx.shadowColor = "#922cff"; ctx.shadowBlur = 15;
  ctx.stroke(); ctx.shadowBlur = 0;

  ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - radius * 0.3, y - radius * 0.2); ctx.lineTo(x, y); ctx.lineTo(x + radius * 0.2, y + radius * 0.3); ctx.stroke();

  ctx.fillStyle = "#d9c8e9"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
  ctx.fillText("✦", x, y + 4);
}

function drawPlayer() {
  const pos = playerPosition();
  const x = pos.x + laneWidth() * 0.5; // Сдвиг из-за тротуаров
  
  ctx.fillStyle = "#00000066";
  ctx.beginPath(); ctx.ellipse(x, pos.y + 16, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.font = "34px Arial"; ctx.textAlign = "center";
  ctx.fillText("🐇", x, pos.y + 12);
}

function drawGame() {
  if (!canvas.clientWidth || !canvas.clientHeight) return;
  drawRoad();
  drawCars();
  drawStone();
  drawPlayer();
}

function createRoadObstacles() {
  obstacles = [];
  const difficulty = getDifficulty();
  for (let row = 1; row < ROWS - 1; row++) {
    if (Math.random() < 0.42 + difficulty.randomness * 0.3) {
      obstacles.push({
        x: Math.floor(Math.random() * (LANES - 2)), // Машины только на дороге
        y: row, type: "car",
        color: ["#c15b77", "#5796c8", "#d5a34e", "#8062b6"][Math.floor(Math.random() * 4)],
        offset: 0
      });
    }
  }
}

function updateObstacles(delta) {
  const speedFactor = delta / 1000;
  obstacles.forEach(item => {
    item.offset += speedFactor * 0.5;
    if (item.offset > 1) item.offset = -1;
  });
}

function checkCollision() {
  const hit = obstacles.some(item => {
    if (item.y !== player.y) return false;
    return Math.abs((item.x + item.offset) - player.x) < 0.4;
  });
  if (hit) { finishGame(false, "Заяц столкнулся с препятствием!"); return true; }
  return false;
}

function movePlayer(dx, dy) {
  if (!gameRunning || gamePaused || gameFinished) return;
  const nx = player.x + dx; const ny = player.y + dy;
  if (nx < 0 || nx >= LANES - 2) return; // Заяц бегает только по дороге
  if (ny < 0 || ny >= ROWS) return;
  player.x = nx; player.y = ny;
  if (checkCollision()) return;
  if (player.y === 0) completeStage();
  drawGame();
}

function completeStage() {
  if (stageTransition || gameFinished) return;
  stageTransition = true; transitionTimer = 0;
  score++; stage++;
  currentMultiplier = getDifficulty().multiplier * Math.pow(1.1, score - 1);
  player = { x: Math.floor(Math.random() * (LANES - 2)), y: 7 };
  stoneProgress = Math.min(0.9, stoneProgress + 0.08 + stage * 0.012);
  createRoadObstacles();
  updateStats();
  setStatus("Локация пройдена! Продолжай движение.");
  drawGame();
}

function gameLoop(time) {
  if (!gameRunning || gamePaused || gameFinished) return;
  const delta = Math.min(time - lastTime, 50);
  lastTime = time;
  spawnTimer += delta;
  
  const difficulty = getDifficulty();
  stoneProgress += delta / 1000 * 0.012 * difficulty.speed * (1 + stage * 0.13);
  
  updateObstacles(delta);
  if (checkCollision()) return;
  if (stoneProgress >= 1) { finishGame(false, "Каменный шар догнал зайца!"); return; }
  
  drawGame();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  if (!validateBet()) return;
  currentBet = Number(stakeInput.value);
  if (!debitBalance(currentBet)) { setStatus("Недостаточно сфер"); return; }
  
  stage = 1; score = 0; currentMultiplier = getDifficulty().multiplier;
  player = { x: Math.floor(Math.random() * (LANES - 2)), y: 7 };
  obstacles = []; stoneProgress = 0; spawnTimer = 0;
  stageTransition = false; transitionTimer = 0;
  gameFinished = false; gamePaused = false; gameRunning = true;
  
  createRoadObstacles(); updateStats();
  overlay.classList.add("hidden");
  setStatus("Испытание началось. Удачи!");
  
  if (animationId) cancelAnimationFrame(animationId);
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function finishGame(won, message) {
  if (gameFinished) return;
  gameFinished = true; gameRunning = false;
  if (animationId) cancelAnimationFrame(animationId);
  
  let reward = 0;
  if (won) { reward = Math.floor(currentBet * currentMultiplier); creditBalance(reward); }
  
  $("modalTitle").textContent = won ? "🏆 Победа!" : "💥 Испытание окончено";
  $("modalDescription").textContent = won ? "Ты прошёл испытание! Получено: " + reward + " сфер." : message + " Пройдено локаций: " + score + ". Ставка: " + currentBet + " сфер.";
  $("setupControls").style.display = "none"; $("resultControls").style.display = "block";
  overlay.classList.remove("hidden");
  setStatus(won ? "Награда начислена: " + reward + " сфер" : "Попробуй ещё раз");
  updateBalance();
}

let touchStartX = 0, touchStartY = 0;
canvas.addEventListener("touchstart", event => {
  const touch = event.changedTouches[0];
  touchStartX = touch.clientX; touchStartY = touch.clientY;
}, { passive: true });

canvas.addEventListener("touchend", event => {
  if (!gameRunning || gamePaused) return;
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX; const dy = touch.clientY - touchStartY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 1 : -1, 0);
  else movePlayer(0, dy > 0 ? 1 : -1);
}, { passive: true });

$("startButton").addEventListener("click", startGame);
$("bottomPlay").addEventListener("click", () => { if (!gameRunning) showSetup(); });
$("againButton").addEventListener("click", () => showSetup());
$("closeButton").addEventListener("click", () => showSetup());

window.addEventListener("resize", resizeCanvas);
window.addEventListener("load", () => {
  updateBalance(); updateStats(); resizeCanvas(); showSetup();
});

if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
