<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10051f">
    <title>Зал Оракула</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... ТВОЙ CSS ... */
        :root {
            --bg: #10051f; --bg-light: #1b0b32; --panel: rgba(35, 12, 62, 0.88);
            --panel-light: rgba(54, 20, 91, 0.8); --purple: #922cff;
            --purple-light: #bd78ff; --purple-bright: #d9a6ff; --text: #f5eaff;
            --muted: #b89bd7; --gold: #ffd34f; --border: rgba(164, 65, 255, 0.48);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        body { min-height: 100vh; min-height: 100dvh; }
        button, label { font: inherit; }
        button { color: inherit; }
        .app { position: relative; width: 100%; max-width: 520px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 16px 16px 112px; overflow: hidden; background: radial-gradient(ellipse at 50% 28%, rgba(104, 25, 174, 0.18), transparent 42%), radial-gradient(ellipse at 10% 85%, rgba(87, 20, 147, 0.12), transparent 35%), linear-gradient(180deg, #10051f 0%, #0c0418 100%); }
        input[name="screen"], #game-open { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .screen { display: none; animation: screenAppear 0.35s ease both; }
        @keyframes screenAppear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .topbar { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-bottom: 34px; }
        .user-button { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 7px 12px 7px 7px; border: 1px solid var(--border); border-radius: 50px; background: linear-gradient(120deg, rgba(62, 20, 105, 0.8), rgba(20, 7, 39, 0.9)); cursor: pointer; }
        .avatar { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 54px; height: 54px; border: 2px solid #9e42ff; border-radius: 50%; background: radial-gradient(circle, #8d39d9, #291044 75%); box-shadow: 0 0 15px rgba(151, 53, 255, 0.55); }
        .avatar-bunny { font-size: 30px; filter: drop-shadow(0 0 5px #d6a1ff); }
        .online-dot { position: absolute; right: -2px; bottom: 0; width: 15px; height: 15px; border: 2px solid #1b0a2e; border-radius: 50%; background: #51ec57; box-shadow: 0 0 8px #51ec57; }
        .user-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .user-info strong { font-size: 16px; font-weight: 650; }
        .user-info small { color: var(--muted); font-size: 11px; white-space: nowrap; }
        .header-arrow { margin-left: auto; color: var(--purple-light); font-size: 27px; }
        .balance { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 10px 9px 10px 13px; border: 1px solid rgba(255, 186, 76, 0.3); border-radius: 50px; background: linear-gradient(120deg, #26113c, #160824); box-shadow: 0 0 14px rgba(161, 57, 255, 0.12); }
        .balance strong { font-size: 19px; font-weight: 650; }
        .star-icon { color: var(--gold); font-size: 27px; text-shadow: 0 0 10px rgba(255, 198, 42, 0.8); }
        .add-balance { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-left: 3px; border: 0; border-radius: 50%; background: #34115b; color: #e5c4ff; font-size: 26px; cursor: pointer; }
        .home-title, .section-heading { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 15px 0 24px; }
        .home-title h1, .section-heading h1 { color: #d8a0ff; font-family: Georgia, serif; font-size: clamp(27px, 7vw, 38px); font-weight: 400; text-align: center; text-shadow: 0 0 14px rgba(180, 91, 255, 0.8); }
        .title-decoration { width: 35px; height: 1px; background: linear-gradient(90deg, transparent, #b65cff); }
        .title-decoration:last-child { transform: rotate(180deg); }
        .section-heading span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #a746ff); }
        .section-heading span:last-child { transform: rotate(180deg); }
        .oracle-section { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 330px; margin: 0 auto 20px; isolation: isolate; }
        .oracle-glow { position: absolute; top: 30%; left: 50%; width: 250px; height: 250px; border-radius: 50%; background: #8124ff; opacity: 0.16; filter: blur(70px); transform: translate(-50%, -50%); z-index: -1; }
        .crystal-orb { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; width: 205px; height: 205px; overflow: hidden; border: 2px solid rgba(207, 155, 255, 0.9); border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(229, 185, 255, 0.7), transparent 17%), radial-gradient(circle at 50% 55%, #48117d 0%, #21073f 50%, #12051f 100%); box-shadow: inset -15px -20px 35px rgba(0, 0, 0, 0.65), inset 10px 8px 25px rgba(219, 164, 255, 0.3), 0 0 15px #9e35ff, 0 0 40px rgba(155, 48, 255, 0.65); }
        .orb-shine { position: absolute; top: 13px; left: 28px; width: 48px; height: 20px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); filter: blur(9px); transform: rotate(-40deg); }
        .orb-magic { position: relative; width: 145px; height: 145px; border: 1px solid rgba(179, 86, 255, 0.3); border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(174, 65, 255, 0.6), transparent, rgba(217, 145, 255, 0.4), transparent); animation: orbRotate 8s linear infinite; }
        .orb-magic::before, .orb-magic::after { position: absolute; content: ""; inset: 13px; border: 1px solid rgba(198, 115, 255, 0.45); border-radius: 50%; }
        .orb-magic::after { inset: 30px; border-color: rgba(218, 165, 255, 0.35); }
        .magic-star { position: absolute; color: #e9caff; text-shadow: 0 0 12px #bd65ff; }
        .star-one { top: 8px; left: 63px; font-size: 23px; }
        .star-two { right: 10px; bottom: 30px; font-size: 19px; }
        .star-three { bottom: 8px; left: 26px; font-size: 15px; }
        .magic-core { position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; border-radius: 50%; background: #edcaff; box-shadow: 0 0 12px #d8a0ff, 0 0 35px #a12cff; transform: translate(-50%, -50%); }
        @keyframes orbRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .orb-stand { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; margin-top: -12px; }
        .stand-top { width: 190px; height: 17px; border: 1px solid #9f53e6; border-radius: 50%; background: linear-gradient(90deg, #31104c, #9b45dc, #31104c); box-shadow: 0 0 13px #9e3cff; }
        .stand-body { display: flex; align-items: center; justify-content: center; width: 145px; height: 48px; margin-top: -4px; border: 1px solid #6b2da0; border-radius: 5px 5px 25px 25px; background: linear-gradient(90deg, #170823, #4a176d, #170823); box-shadow: inset 0 0 15px #10051c; }
        .stand-gem { color: #d9a0ff; font-size: 30px; text-shadow: 0 0 12px #b34cff; }
        .stand-bottom { width: 180px; height: 13px; margin-top: -2px; border: 1px solid #7734a7; border-radius: 50%; background: #28103f; box-shadow: 0 5px 20px rgba(162, 54, 255, 0.4); }
        .welcome-card { padding: 23px 15px; border: 1px solid var(--border); border-radius: 25px; background: radial-gradient(circle at 50% 0%, rgba(117, 40, 185, 0.25), transparent 60%), linear-gradient(140deg, rgba(43, 13, 72, 0.9), rgba(19, 6, 35, 0.95)); text-align: center; box-shadow: 0 0 22px rgba(122, 33, 207, 0.12); margin-bottom: 20px; }
        .welcome-card h2 { color: #d8a0ff; font-family: Georgia, serif; font-size: 23px; font-weight: 400; }
        .welcome-balance { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 3px; }
        .welcome-balance .star-icon { font-size: 42px; }
        .welcome-balance strong { color: #e4c5ff; font-size: 45px; font-weight: 500; text-shadow: 0 0 15px rgba(179, 97, 255, 0.5); }
        .welcome-card p { color: var(--muted); font-size: 14px; }
        .game-card { overflow: hidden; border: 1px solid #8b2ce3; border-radius: 25px; background: linear-gradient(150deg, #25103e, #10051f); box-shadow: 0 0 20px rgba(135, 41, 218, 0.2); margin-top: 20px; }
        .game-preview { position: relative; height: 200px; overflow: hidden; background: radial-gradient(circle at 50% 50%, #5d347e, #27123e); display: flex; justify-content: center; align-items: center; font-size: 80px; }
        .game-card-content { padding: 20px 17px 16px; }
        .game-card-content h2 { margin-bottom: 9px; color: #e3bdff; font-size: 25px; text-align: center; }
        .game-card-content p { color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; margin-bottom: 15px; }
        .play-button { display: flex; align-items: center; justify-content: center; gap: 13px; width: 100%; padding: 16px; border: 1px solid #d28aff; border-radius: 50px; background: linear-gradient(100deg, #8e21ec, #b04bff, #7615d7); box-shadow: 0 0 20px rgba(161, 50, 255, 0.45); color: white; font-size: 19px; font-weight: 650; cursor: pointer; }
        .play-button:active { filter: brightness(1.2); transform: scale(0.98); }
        .bottom-nav { position: fixed; z-index: 20; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; display: grid; grid-template-columns: repeat(4, 1fr); width: min(calc(100% - 20px), 500px); padding: 12px 5px 10px; border: 1px solid rgba(136, 47, 206, 0.5); border-radius: 30px; background: rgba(20, 6, 36, 0.96); box-shadow: 0 -5px 30px rgba(102, 29, 170, 0.17); backdrop-filter: blur(15px); transform: translateX(-50%); }
        .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; padding: 3px 0; color: #a981d0; font-size: 11px; cursor: pointer; }
        .nav-icon { font-size: 25px; line-height: 1.2; filter: drop-shadow(0 0 5px rgba(167, 90, 255, 0.3)); }
        .nav-item::after { position: absolute; right: 20%; bottom: -10px; left: 20%; height: 3px; border-radius: 10px; background: transparent; content: ""; }
        #screen-home:checked ~ .app .nav-item, #screen-games:checked ~ .app .nav-games, #screen-cases:checked ~ .app .nav-cases, #screen-bonuses:checked ~ .app .nav-bonuses, #screen-profile:checked ~ .app .nav-profile { color: #e0b9ff; text-shadow: 0 0 10px #a64bff; }
        #screen-games:checked ~ .app .nav-games::after, #screen-cases:checked ~ .app .nav-cases::after, #screen-bonuses:checked ~ .app .nav-bonuses::after, #screen-profile:checked ~ .app .nav-profile::after { background: #c46cff; box-shadow: 0 0 12px #b34aff; }
        #screen-home:checked ~ .app .screen-home { display: block; }
        #screen-games:checked ~ .app .screen-games { display: block; }
        #screen-cases:checked ~ .app .screen-cases { display: block; }
        #screen-bonuses:checked ~ .app .screen-bonuses { display: block; }
        #screen-profile:checked ~ .app .screen-profile { display: block; }
        .game-screen { position: fixed; z-index: 50; inset: 0; display: none; flex-direction: column; overflow: hidden; background: #10051f; }
        #game-open:checked ~ .app .game-screen { display: flex; }
        .game-topbar { position: absolute; z-index: 10; top: max(15px, env(safe-area-inset-top)); right: 15px; left: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .pause-button, .game-score, .game-distance { display: flex; align-items: center; justify-content: center; min-height: 43px; padding: 8px 14px; border: 1px solid rgba(183, 98, 255, 0.6); border-radius: 14px; background: rgba(28, 8, 49, 0.9); box-shadow: 0 0 15px rgba(149, 47, 255, 0.2); backdrop-filter: blur(10px); }
        .pause-button { width: 45px; color: #e2bdff; font-size: 22px; cursor: pointer; }
        .game-score { gap: 7px; color: var(--gold); font-size: 18px; }
        .game-distance { color: #e6c9ff; font-size: 16px; }
        #gameCanvas { width: 100%; flex: 1; height: 100%; touch-action: none; background: #3a2850; }
        #splash { position: fixed; inset: 0; z-index: 9999; background: #0c0418; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        #splash.hide { opacity: 0; pointer-events: none; display: none; }
        .splash-content { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .splash-logo { font-family: Georgia, serif; font-size: 40px; font-weight: 700; letter-spacing: 5px; color: #d8a0ff; text-shadow: 0 0 20px rgba(180, 91, 255, 0.8); }
        .splash-orb { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(229, 185, 255, 0.7), transparent 17%), radial-gradient(circle at 50% 55%, #48117d 0%, #21073f 50%, #12051f 100%); box-shadow: inset -15px -20px 35px rgba(0, 0, 0, 0.65), inset 10px 8px 25px rgba(219, 164, 255, 0.3), 0 0 15px #9e35ff, 0 0 40px rgba(155, 48, 255, 0.65); position: relative; display: flex; justify-content: center; align-items: center; }
        .splash-orb-inner { width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(179, 86, 255, 0.3); background: conic-gradient(from 0deg, transparent, rgba(174, 65, 255, 0.6), transparent, rgba(217, 145, 255, 0.4), transparent); animation: orbRotate 4s linear infinite; }
        .splash-loader { width: 200px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .splash-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #d8a0ff); border-radius: 3px; animation: loadProgress 2s ease forwards; }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }
        .splash-text { color: #b89bd7; font-size: 14px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-content">
            <div class="splash-logo">MAGIC</div>
            <div class="splash-orb"><div class="splash-orb-inner"></div></div>
            <div class="splash-loader"><div class="splash-progress"></div></div>
            <div class="splash-text">Загрузка...</div>
        </div>
    </div>

    <input type="radio" name="screen" id="screen-home" checked>
    <input type="radio" name="screen" id="screen-games">
    <input type="radio" name="screen" id="screen-cases">
    <input type="radio" name="screen" id="screen-bonuses">
    <input type="radio" name="screen" id="screen-profile">
    <input type="checkbox" id="game-open">

    <div class="app">
        <header class="topbar">
            <label for="screen-profile" class="user-button">
                <span class="avatar"><span class="avatar-bunny">🐰</span><span class="online-dot"></span></span>
                <span class="user-info"><strong>Гость</strong><small>Добро пожаловать!</small></span>
                <span class="header-arrow">›</span>
            </label>
            <div class="balance">
                <span class="star-icon">★</span><strong class="bal-val">100</strong>
                <button class="add-balance" type="button" onclick="tg.showAlert('Скоро!')">+</button>
            </div>
        </header>

        <main class="screen screen-home">
            <div class="home-title"><span class="title-decoration"></span><h1>Зал Оракула</h1><span class="title-decoration"></span></div>
            <section class="oracle-section">
                <div class="oracle-glow"></div>
                <div class="crystal-orb">
                    <div class="orb-shine"></div>
                    <div class="orb-magic"><span class="magic-star star-one">✦</span><span class="magic-star star-two">✧</span><span class="magic-star star-three">✦</span><span class="magic-core"></span></div>
                </div>
                <div class="orb-stand"><div class="stand-top"></div><div class="stand-body"><span class="stand-gem">◆</span></div><div class="stand-bottom"></div></div>
            </section>
            <section class="welcome-card">
                <h2>Добро пожаловать!</h2>
                <div class="welcome-balance"><span class="star-icon">★</span><strong class="bal-val">100</strong></div>
                <p>Твой баланс</p>
            </section>
        </main>

        <main class="screen screen-games">
            <div class="section-heading"><span></span><h1>Игры</h1><span></span></div>
            <article class="game-card">
                <div class="game-preview">🐰</div>
                <div class="game-card-content">
                    <h2>Перебеги дорогу</h2>
                    <p>Помоги зайцу преодолеть препятствия. Не дай каменному шару догнать тебя!</p>
                    <label for="game-open" class="play-button"><span class="play-icon">▶</span> Играть</label>
                </div>
            </article>
        </main>

        <main class="screen screen-cases">
            <div class="section-heading"><span></span><h1>Кейсы</h1><span></span></div>
            <div class="welcome-card"><h2>Скоро...</h2><p>Здесь будут NFT-кейсы с зайцами.</p></div>
        </main>

        <main class="screen screen-profile">
            <div class="section-heading"><span></span><h1>Профиль</h1><span></span></div>
            <div class="welcome-card">
                <div style="font-size: 60px; margin-bottom: 10px;">🐰</div>
                <h2>Гость</h2>
                <div class="welcome-balance" style="margin-top: 15px;"><span class="star-icon">★</span><strong class="bal-val">100</strong></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <label for="screen-games" class="nav-item nav-games"><span class="nav-icon">🎮</span><span>Игры</span></label>
            <label for="screen-cases" class="nav-item nav-cases"><span class="nav-icon">🎁</span><span>Кейсы</span></label>
            <label for="screen-bonuses" class="nav-item nav-bonuses"><span class="nav-icon">✦</span><span>Бонусы</span></label>
            <label for="screen-profile" class="nav-item nav-profile"><span class="nav-icon">♟</span><span>Профиль</span></label>
        </nav>

        <section class="game-screen">
            <header class="game-topbar">
                <label for="game-open" class="pause-button">Ⅱ</label>
                <div class="game-score"><span>★</span><strong class="bal-val">100</strong></div>
                <div class="game-distance"><strong id="distanceLabel">0 м</strong></div>
            </header>
            <canvas id="gameCanvas"></canvas>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
