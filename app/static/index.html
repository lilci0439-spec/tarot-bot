<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<title>Magic</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0812;--card:#15111f;--c2:#1e1830;--line:#2e2650;--pu:#8b5cf6;--pu2:#a78bfa;--tx:#f5f2ff;--mu:#9b93b9;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(120% 55% at 50% -8%,#2d1860 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{-webkit-user-drag:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px}
.logo{flex:1;font-size:22px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#c4b5fd,#8b5cf6 60%,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap;background:rgba(30,24,48,.8);border:1px solid var(--line);border-radius:20px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bump{animation:pp .4s}
@keyframes pp{50%{transform:scale(1.12);border-color:var(--pu)}}
main{flex:1;overflow-y:auto;padding:2px 14px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tab{display:none}
.tab.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{margin:6px 0 12px;font-size:19px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
.case{position:relative;overflow:hidden;padding:16px 10px 12px;text-align:center;background:linear-gradient(180deg,var(--c2),var(--card));border:1px solid var(--line);border-radius:20px;transition:transform .15s,border-color .2s}
.case:active{transform:scale(.96);border-color:var(--c)}
.case::before{content:"";position:absolute;left:50%;top:80px;width:170px;height:170px;margin:-85px 0 0 -85px;background:radial-gradient(circle,var(--c),transparent 66%);opacity:.5}
.case img.m{position:relative;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 16px var(--c));animation:fl 3.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.case .n{position:relative;font-size:16px;font-weight:800}
.mini{position:relative;display:flex;justify-content:center;gap:2px;margin:6px 0 10px;opacity:.85}
.price{position:relative;padding:9px;font-size:14px;font-weight:800;background:linear-gradient(90deg,var(--pu),#6d28d9);border-radius:12px;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.btn{width:100%;padding:14px 18px;font-size:15px;font-weight:800;background:linear-gradient(90deg,var(--pu),#6d28d9);border-radius:14px;box-shadow:0 6px 18px rgba(139,92,246,.35);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--c2);border:1px solid var(--line);box-shadow:none}
.gm{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;padding:16px;text-align:left;background:linear-gradient(135deg,var(--c2),var(--card));border:1px solid var(--line);border-radius:20px}
.gm svg{flex:0 0 46px;width:46px;height:46px;padding:10px;border-radius:14px;background:rgba(139,92,246,.15);stroke:var(--pu2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gm b{display:block;font-size:16px}
.gm span{color:var(--mu);font-size:13px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips button{flex:1;padding:10px 0;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chips button.on{background:var(--pu);border-color:var(--pu2)}
.back{margin-bottom:8px;padding:4px 0;color:var(--mu);font-size:14px}
.panel{display:none}
.panel.on{display:block}
.res{min-height:28px;margin:12px 0;text-align:center;font-size:17px;font-weight:800}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.wheel{position:relative;width:min(78vw,310px);margin:10px auto 14px}
.wheel canvas{display:block;width:100%;border-radius:50%;box-shadow:0 0 50px rgba(139,92,246,.5);transition:transform 6s cubic-bezier(.12,.6,.1,1);will-change:transform}
.wheel::after{content:"";position:absolute;left:50%;top:-8px;margin-left:-13px;border:13px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 2px 6px #000)}
.slots{display:flex;justify-content:center;gap:10px;margin:14px 0}
.rS{display:flex;align-items:center;justify-content:center;width:min(26vw,104px);height:min(26vw,104px);font-size:min(14vw,58px);background:linear-gradient(180deg,var(--c2),var(--card));border:2px solid var(--pu);border-radius:18px;box-shadow:inset 0 0 20px rgba(139,92,246,.25)}
.rS.sp{filter:blur(1.5px);transform:scaleY(1.06)}
.rS.pop{animation:pp .35s}
.mines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:310px;margin:12px auto}
.mines button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.mines button.s{background:#103527;border-color:var(--ok);animation:pop .3s}
.mines button.m{background:#3b1220;border-color:var(--bad);animation:pop .3s}
.mines button.f{opacity:.35}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.box{margin-bottom:12px;padding:16px;background:linear-gradient(135deg,var(--c2),var(--card));border:1px solid var(--line);border-radius:18px}
.box p{margin:6px 0 12px;color:var(--mu);font-size:14px}
.stat{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--mu)}
.stat b{color:var(--tx)}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv{padding:10px 4px;text-align:center;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--rc);border-radius:14px}
.inv img{display:block;margin:0 auto 4px}
.inv button{width:92%;margin-top:6px;padding:6px 4px;font-size:11px;background:var(--c2);border-radius:8px}
.empty{grid-column:1/-1;color:var(--mu);font-size:14px}
nav{display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(21,17,31,.92);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pu2)}
nav button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--pu);box-shadow:0 0 12px var(--pu)}
#ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:rgba(6,4,12,.97)}
#ov.on{display:flex}
#ot{font-size:20px;font-weight:800}
.rw{position:relative;width:100%;max-width:680px;padding:16px 0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.rw::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fbbf24;box-shadow:0 0 14px #fbbf24;z-index:2}
.reel{display:flex;will-change:transform}
.it{flex:0 0 100px;height:100px;margin-right:8px;display:flex;align-items:center;justify-content:center;border-radius:14px;border-bottom:3px solid var(--rc);background:radial-gradient(circle at 50% 40%,var(--c),transparent 72%),var(--c2);transition:transform .3s,box-shadow .3s}
.it.hit{transform:scale(1.12);box-shadow:0 0 28px var(--rc)}
#ov.done .rw,#ov.done #ot{display:none}
#win{display:none;width:100%;max-width:360px;padding:22px 18px;text-align:center;background:linear-gradient(180deg,var(--c2),var(--card));border:1px solid var(--c);border-radius:24px;box-shadow:0 0 70px var(--c)}
#win.on{display:block;animation:pop .35s}
#win img{display:block;margin:6px auto 8px;filter:drop-shadow(0 10px 24px var(--c))}
#win h3{margin-bottom:16px;font-size:22px}
.rb{font-size:13px;font-weight:800}
.row{display:flex;gap:10px}
.cf{position:fixed;left:50%;top:45%;z-index:200;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:cf 1.1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#toast{position:fixed;left:50%;bottom:92px;z-index:99;transform:translateX(-50%);padding:10px 16px;font-size:14px;font-weight:600;background:var(--c2);border:1px solid var(--pu);border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
#load{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .4s}
#load.hide{opacity:0;pointer-events:none}
#ball{font-size:76px;transition:transform 1s cubic-bezier(.5,0,1,.7)}
#ball.go{transform:translateX(120vw)}
#ball span{display:block;animation:rl 1s linear infinite}
#ball.go span{animation-duration:.45s}
@keyframes rl{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.case img.m,#ball span{animation:none}}
</style>
</head>
<body>
<div id="load"><div id="ball"><span>🎱</span></div></div>
<div id="app">
  <header>
    <div class="logo">MAGIC</div>
    <div class="pill"><i></i><span id="online">0</span></div>
    <div class="pill" id="bp"><span class="bal">0</span> ⭐</div>
  </header>
  <main>
    <section class="tab" id="t-games">
      <div id="gmenu">
        <h2>Игры</h2>
        <button class="gm" data-g="wheel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg><div><b>Колесо</b><span>Множители до x3</span></div></button>
        <button class="gm" data-g="slots"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M8.5 6v12M15.5 6v12"/></svg><div><b>Слоты</b><span>Три барабана, три одинаковых — x1.5</span></div></button>
        <button class="gm" data-g="mines"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6"/><path d="M12 7V4M16 8l2-2M8 8 6 6M3 13h3M18 13h3"/></svg><div><b>Мины</b><span>Найди кристаллы и забери x2</span></div></button>
      </div>
      <div id="gplay" style="display:none">
        <button class="back" id="gback">← К списку игр</button>
        <div class="chips" id="chips"></div>
        <div class="panel" id="g-wheel">
          <div class="wheel"><canvas id="wc" width="600" height="600"></canvas></div>
          <div class="res" id="wr"></div>
          <button class="btn" id="wbtn">Крутить</button>
        </div>
        <div class="panel" id="g-slots">
          <div class="slots"><div class="rS">❔</div><div class="rS">❔</div><div class="rS">❔</div></div>
          <div class="res" id="sr"></div>
          <button class="btn" id="sbtn">Крутить</button>
        </div>
        <div class="panel" id="g-mines">
          <div class="mines" id="mgrid"></div>
          <div class="res" id="mr">Открой 3 кристалла и не попади на мину</div>
          <button class="btn" id="mbtn">Начать игру</button>
        </div>
      </div>
    </section>
    <section class="tab" id="t-cases"><h2>Кейсы</h2><div class="grid" id="cases"></div></section>
    <section class="tab" id="t-earn">
      <h2>Заработок</h2>
      <div class="box"><b>Ежедневный бонус</b><p>Забирай 50 ⭐ раз в сутки.</p><button class="btn" id="bonus">Забрать бонус</button></div>
      <div class="box"><b>Пригласи друзей</b><p>Отправь ссылку на Magic друзьям в Telegram.</p><button class="btn sec" id="invite">Поделиться</button></div>
    </section>
    <section class="tab" id="t-profile">
      <h2 id="uname">Профиль</h2>
      <div class="box">
        <div class="stat">Баланс<b><span class="bal">0</span> ⭐</b></div>
        <div class="stat">Открыто кейсов<b id="s1">0</b></div>
        <div class="stat">Подарков в инвентаре<b id="s2">0</b></div>
      </div>
      <h2>Инвентарь</h2>
      <div class="list" id="inv"></div>
    </section>
  </main>
  <nav id="nav">
    <button data-t="games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 13.5h.01"/></svg>Игры</button>
    <button data-t="cases" class="on"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Кейсы</button>
    <button data-t="earn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9a3 3 0 0 0-5 1.5c0 3 5 1.5 5 4.5a3 3 0 0 1-5 1.5M12 6.5v1.5M12 16v1.5"/></svg>Заработок</button>
    <button data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>Профиль</button>
  </nav>
</div>
<div id="ov">
  <div id="ot"></div>
  <div class="rw" id="rw"><div class="reel" id="reel"></div></div>
  <div id="win"></div>
</div>
<div id="toast"></div>

<script>
const tg=(window.Telegram&&Telegram.WebApp)||{initData:'',initDataUnsafe:{}};
['ready','expand','disableVerticalSwipes'].forEach(f=>{try{tg[f]()}catch(e){}});
try{tg.setHeaderColor('#0a0812');tg.setBackgroundColor('#0a0812')}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ri=n=>Math.floor(Math.random()*n),rr=(a,b)=>Math.random()*(b-a)+a;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const hap=(t,v)=>{try{t==='sel'?tg.HapticFeedback.selectionChanged():tg.HapticFeedback[t+'Occurred'](v)}catch(e){}};

/* ---------- данные ---------- */
const B='https://raw.githubusercontent.com/TelegramMessenger/telegram-ios/master/Telegram/Telegram-iOS/Resources/Assets.xcassets/Gifts/';
const G={
  bear:{n:'Мишка',p:30,c:'#f472b6',r:0,u:B+'Bear.imageset/Bear.png'},
  rose:{n:'Роза',p:50,c:'#ef4444',r:0,u:B+'Rose.imageset/Rose.png'},
  heart:{n:'Сердце',p:100,c:'#ec4899',r:1,u:B+'Heart.imageset/Heart.png'},
  cake:{n:'Торт',p:200,c:'#f59e0b',r:2,u:B+'Cake.imageset/Cake.png'},
  rocket:{n:'Ракета',p:500,c:'#38bdf8',r:2,u:B+'Rocket.imageset/Rocket.png'},
  diamond:{n:'Алмаз',p:1000,c:'#22d3ee',r:3,u:B+'Diamond.imageset/Diamond.png'}
};
const RAR=[['Обычный','#94a3b8'],['Редкий','#38bdf8'],['Эпический','#a78bfa'],['Легендарный','#fbbf24']];
const CASES=[
  {n:'Мишка',price:50,c:'#f472b6',icon:'bear',drops:{bear:50,rose:30,heart:15,cake:5}},
  {n:'Роза',price:100,c:'#ef4444',icon:'rose',drops:{rose:40,heart:30,bear:20,cake:10}},
  {n:'Сердце',price:200,c:'#ec4899',icon:'heart',drops:{heart:40,cake:30,rocket:20,rose:10}},
  {n:'Торт',price:400,c:'#f59e0b',icon:'cake',drops:{cake:45,rocket:35,heart:15,diamond:5}},
  {n:'Алмаз',price:1000,c:'#22d3ee',icon:'diamond',drops:{rocket:45,diamond:35,cake:20}}
];
/* запасная картинка, если внешняя ссылка не загрузилась */
const fb=c=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 8 88 40 50 92 12 40Z" fill="'+c+'"/><path d="M50 8 88 40H12Z" fill="#fff" opacity=".35"/></svg>');
const img=(id,s)=>`<img src="${G[id].u}" width="${s}" height="${s}" style="width:${s}px;height:${s}px;object-fit:contain" alt="${G[id].n}" draggable="false" onerror="this.onerror=null;this.src=fb('${G[id].c}')">`;

/* ---------- состояние ---------- */
let balance=0,bet=50,pb=0,busy=0;
let inv=ls.get('inv',[]).filter(id=>G[id]);
const st=ls.get('st',{opened:0});
const setBal=v=>{balance=Math.round(v*100)/100;$$('.bal').forEach(e=>e.textContent=balance);const p=$('#bp');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')};
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)};
const pick=o=>{let s=0;for(const k in o)s+=o[k];let r=Math.random()*s;for(const k in o){if((r-=o[k])<0)return k}return Object.keys(o)[0]};
const take=()=>{if(balance<bet){toast('Недостаточно ⭐');hap('notification','error');return false}pb=bet;setBal(balance-bet);return true};
function boom(col){for(let i=0;i<36;i++){const d=document.createElement('i'),a=rr(0,6.28),s=rr(90,240);d.className='cf';d.style.cssText=`background:${i%3?col:'#fbbf24'};--x:${Math.cos(a)*s}px;--y:${Math.sin(a)*s+80}px;--r:${rr(-540,540)}deg`;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}}
const result=(el,m,b)=>{
  const w=Math.round(b*m*100)/100;if(w>0)setBal(balance+w);
  el.className='res '+(m>=1?'ok':'bad');
  el.textContent=m>=1?`Выигрыш: ${w} ⭐ (x${m})`:m>0?`Возврат: ${w} ⭐ (x${m})`:'Проигрыш';
  if(m>=1){hap('notification','success');if(m>=2)boom('#8b5cf6')}else hap('notification','error');
};

/* ---------- вкладки ---------- */
function tab(n){
  $$('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+n));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n==='profile')renderInv();
}
$$('#nav button').forEach(b=>b.onclick=()=>{hap('impact','light');tab(b.dataset.t)});

/* ---------- кейсы ---------- */
$('#cases').innerHTML=CASES.map((c,i)=>`<button class="case" style="--c:${c.c}" data-i="${i}">${img(c.icon,84).replace('<img','<img class="m"')}<div class="n">${c.n}</div><div class="mini">${Object.keys(c.drops).map(k=>img(k,22)).join('')}</div><div class="price">${c.price} ⭐</div></button>`).join('');
$$('.case').forEach(b=>b.onclick=()=>openCase(+b.dataset.i));

function openCase(i){
  if(busy)return;
  const c=CASES[i];
  if(balance<c.price){toast('Недостаточно ⭐');hap('notification','error');return}
  busy=1;setBal(balance-c.price);st.opened++;ls.set('st',st);hap('impact','medium');
  const win=pick(c.drops),WIN=35,items=[];
  for(let k=0;k<40;k++)items.push(k===WIN?win:pick(c.drops));
  const rl=$('#reel');
  rl.style.transition='none';rl.style.transform='none';
  rl.innerHTML=items.map(id=>`<div class="it" style="--c:${G[id].c}66;--rc:${RAR[G[id].r][1]}">${img(id,64)}</div>`).join('');
  $('#ot').textContent=c.n;$('#win').classList.remove('on');$('#ov').className='on';
  const W=$('#rw').clientWidth,x=WIN*108+50-W/2+rr(-36,36);
  rl.getBoundingClientRect();
  rl.style.transition='transform 4s cubic-bezier(.1,.75,.1,1)';
  rl.style.transform=`translateX(${-x}px)`;
  const tk=setInterval(()=>hap('sel'),140);
  setTimeout(()=>{clearInterval(tk);rl.children[WIN].classList.add('hit');hap('notification','success');boom(G[win].c)},4150);
  setTimeout(()=>showWin(win),4900);
}
function showWin(id){
  const g=G[id],w=$('#win');
  w.style.setProperty('--c',g.c);
  w.innerHTML=`<div class="rb" style="color:${RAR[g.r][1]}">${RAR[g.r][0]}</div>${img(id,150)}<h3>${g.n}</h3><div class="row"><button class="btn sec" id="keep">Оставить</button><button class="btn" id="sell">Продать за ${g.p} ⭐</button></div>`;
  $('#ov').classList.add('done');w.classList.add('on');
  const end=()=>{$('#ov').className='';w.classList.remove('on');busy=0;renderInv()};
  $('#keep').onclick=()=>{inv.push(id);ls.set('inv',inv);toast('Добавлено в инвентарь');end()};
  $('#sell').onclick=()=>{setBal(balance+g.p);toast('+'+g.p+' ⭐');end()};
}

/* ---------- инвентарь ---------- */
function renderInv(){
  $('#s1').textContent=st.opened;$('#s2').textContent=inv.length;
  $('#inv').innerHTML=inv.length?inv.map((id,k)=>`<div class="inv" style="--rc:${RAR[G[id].r][1]}">${img(id,60)}<div>${G[id].n}</div><button data-k="${k}">Продать ${G[id].p} ⭐</button></div>`).join(''):'<div class="empty">Пока пусто. Открой кейс, и подарки появятся здесь.</div>';
  $$('#inv button').forEach(b=>b.onclick=()=>{const id=inv.splice(+b.dataset.k,1)[0];ls.set('inv',inv);setBal(balance+G[id].p);hap('impact','light');renderInv()});
}

/* ---------- заработок ---------- */
$('#bonus').onclick=()=>{
  const d=new Date().toDateString();
  if(ls.get('bonus','')===d){toast('Бонус уже получен сегодня');return}
  ls.set('bonus',d);setBal(balance+50);toast('+50 ⭐');hap('notification','success');
};
$('#invite').onclick=()=>{
  const u='https://t.me/share/url?url='+encodeURIComponent(location.href);
  tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank');
};

/* ---------- игры: меню и ставка ---------- */
$('#chips').innerHTML=[10,50,100,500].map(v=>`<button data-v="${v}" class="${v===bet?'on':''}">${v}</button>`).join('');
$$('#chips button').forEach(b=>b.onclick=()=>{bet=+b.dataset.v;hap('sel');$$('#chips button').forEach(x=>x.classList.toggle('on',x===b))});
$$('.gm').forEach(b=>b.onclick=()=>{
  $('#gmenu').style.display='none';$('#gplay').style.display='block';
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='g-'+b.dataset.g));
});
$('#gback').onclick=()=>{$('#gmenu').style.display='';$('#gplay').style.display='none'};

/* ---------- колесо ---------- */
const SEC=[{t:'x3',m:3,c:'#8b5cf6',w:1},{t:'Пусто',m:0,c:'#2a2838',w:3},{t:'x1.5',m:1.5,c:'#6d28d9',w:2},{t:'x0.5',m:.5,c:'#3f3a52',w:3},{t:'x2',m:2,c:'#a855f7',w:2},{t:'Пусто',m:0,c:'#2a2838',w:3},{t:'x1.5',m:1.5,c:'#6d28d9',w:2},{t:'x0.5',m:.5,c:'#3f3a52',w:3}];
(function(){
  const x=$('#wc').getContext('2d'),R=300,a=Math.PI/4;
  SEC.forEach((s,i)=>{
    const st=i*a-Math.PI/2,g=x.createRadialGradient(R,R,20,R,R,R);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-14,st,st+a);x.closePath();
    x.fillStyle=s.c;x.fill();x.fillStyle=g;x.fill();
    x.strokeStyle='#0a0812';x.lineWidth=4;x.stroke();
    x.save();x.translate(R,R);x.rotate(st+a/2);x.textAlign='right';x.textBaseline='middle';
    x.fillStyle='#fff';x.font='800 42px sans-serif';x.fillText(s.t,R-40,0);x.restore();
  });
  x.lineWidth=12;x.strokeStyle='#a78bfa';x.beginPath();x.arc(R,R,R-8,0,7);x.stroke();
  for(let i=0;i<24;i++){x.beginPath();x.arc(R+(R-8)*Math.cos(i*Math.PI/12),R+(R-8)*Math.sin(i*Math.PI/12),4,0,7);x.fillStyle='#fff';x.fill()}
  x.beginPath();x.arc(R,R,34,0,7);x.fillStyle='#0a0812';x.fill();x.lineWidth=6;x.strokeStyle='#8b5cf6';x.stroke();
})();
let rot=0,wsp=0;
$('#wbtn').onclick=()=>{
  if(wsp||!take())return;wsp=1;
  const b=pb,wr=$('#wr');wr.textContent='';wr.className='res';
  let tot=0;SEC.forEach(s=>tot+=s.w);
  let r=Math.random()*tot,i=0;
  for(;i<SEC.length;i++){if((r-=SEC[i].w)<0)break}
  i=Math.min(i,SEC.length-1);
  rot=rot-(rot%360)+360*6+(360-(i+.5)*45)+rr(-15,15);
  $('#wc').style.transform=`rotate(${rot}deg)`;
  const tk=setInterval(()=>hap('sel'),180);
  setTimeout(()=>{clearInterval(tk);result(wr,SEC[i].m,b);wsp=0},6100);
};

/* ---------- слоты ---------- */
const SYM=['🍒','🍋','💎','7️⃣','💀'];
let ssp=0;
$('#sbtn').onclick=()=>{
  if(ssp||!take())return;ssp=1;
  const b=pb,rs=$$('.rS'),fin=[ri(5),ri(5),ri(5)],done=[0,0,0],sr=$('#sr');
  sr.textContent='';sr.className='res';
  rs.forEach(e=>{e.classList.add('sp');e.classList.remove('pop')});
  const iv=setInterval(()=>rs.forEach((e,k)=>{if(!done[k])e.textContent=SYM[ri(5)]}),70);
  rs.forEach((e,k)=>setTimeout(()=>{done[k]=1;e.textContent=SYM[fin[k]];e.classList.remove('sp');e.classList.add('pop');hap('impact','light')},[1000,1500,2000][k]));
  setTimeout(()=>{
    clearInterval(iv);
    const [a,c,d]=fin;let m=0;
    if(a===c&&c===d)m=a===4?0:1.5;
    else if(a===c||c===d||a===d)m=.5;
    result(sr,m,b);ssp=0;
  },2150);
};

/* ---------- мины ---------- */
const WIN_AT=3; /* сколько кристаллов нужно открыть для победы (6 = найти все) */
let mm=[],mopen=0,mon=0,mb=0;
function mdraw(){
  $('#mgrid').innerHTML=Array.from({length:9},(_,i)=>`<button data-i="${i}">❔</button>`).join('');
  $$('#mgrid button').forEach(b=>b.onclick=()=>mclick(+b.dataset.i,b));
}
mdraw();
$('#mbtn').onclick=()=>{
  if(mon||!take())return;
  mon=1;mb=pb;mopen=0;mdraw();
  const s=new Set();while(s.size<3)s.add(ri(9));mm=[...s];
  $('#mr').className='res';$('#mr').textContent='Открывай клетки';
};
function mclick(i,b){
  if(!mon||b.dataset.o)return;
  b.dataset.o=1;
  if(mm.includes(i)){
    mon=0;
    $$('#mgrid button').forEach((x,k)=>{
      if(mm.includes(k)){x.textContent='💣';x.classList.add('m')}
      else if(!x.dataset.o){x.textContent='💎';x.classList.add('f')}
    });
    result($('#mr'),0,mb);
  }else{
    b.textContent='💎';b.classList.add('s');mopen++;hap('impact','light');
    if(mopen>=WIN_AT){mon=0;result($('#mr'),2,mb)}
  }
}

/* ---------- загрузка ---------- */
const get=(u,o)=>Promise.race([fetch(u,o).then(r=>r.json()),new Promise((_,j)=>setTimeout(j,4000))]);
const loadOnline=()=>get('/api/online').then(d=>{$('#online').textContent=d.online}).catch(()=>{});
(async function(){
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u)$('#uname').textContent=u.first_name||u.username||'Профиль';
  const t0=Date.now();
  const [r]=await Promise.allSettled([get('/api/balance',{headers:{Authorization:tg.initData}}),loadOnline()]);
  setBal(r.status==='fulfilled'&&r.value&&typeof r.value.balance==='number'?r.value.balance:1000);
  tab('cases');
  setTimeout(()=>{
    $('#ball').classList.add('go');
    setTimeout(()=>$('#load').classList.add('hide'),900);
  },Math.max(0,1200-(Date.now()-t0)));
  setInterval(loadOnline,30000);
})();
</script>
</body>
</html>
